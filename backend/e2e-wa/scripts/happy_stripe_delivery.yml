id: happy_stripe_delivery
pack: a
priority: p0
manual: "M2 rows 45–48, 65 (+ customize)"
timeout_ms: 90000
steps:
  - macro: open_restaurant
  - macro: add_doner_ayran_delivery
  - gate: { name: basket_len, gte: 2 }
  - gate: { name: state, in: [browsing] }
  - macro: start_checkout
  - macro: ensure_confirming
  - macro: confirm_order
  # Assert Stripe delivery order exists unpaid (pay-link path), then tear down so
  # Küchenbrett is not left with an Ausstehend E2E card.
  - gate: { name: order_stripe_delivery, address_includes: "Hauptstraße" }
  - macro: mark_last_order_paid
  - macro: cancel_last_order
