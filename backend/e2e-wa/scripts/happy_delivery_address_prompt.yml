id: happy_delivery_address_prompt
pack: c
priority: p1
manual: "M2 row 50 superseded: checkout Flow skip-chat address (no awaiting_delivery_address_* )"
timeout_ms: 90000
steps:
  - macro: open_restaurant
  - macro: clear_last_delivery_address
  - macro: add_doner_ayran_delivery_no_address
  - macro: start_checkout
  # Flow-on: basket confirm opens CHECKOUT_REVIEW. WA Web cannot fill the Flow, so
  # we hard-assert skip-chat (confirming, no order) instead of the old address ladder.
  - gate: { name: state, in: [confirming] }
  - gate: { name: no_order }
